/**:
  ros__parameters:
    # ompl_planning.yaml
    # ===================
    # OMPL planner configurations for the WaferFlow SCARA arm.
    # For wafer handling, we prefer RRTConnect (fast, reliable) or BiTRRT
    # for smoother paths. The custom S-curve retiming in wafer_trajectory
    # handles the timing — OMPL only finds geometric paths.
    
    planning_plugin: ompl_interface/OMPLPlanner
    request_adapters: >-
      default_planner_request_adapters/AddTimeOptimalParameterization
      default_planner_request_adapters/ResolveConstraintFrames
      default_planner_request_adapters/FixWorkspaceBounds
      default_planner_request_adapters/FixStartStateBounds
      default_planner_request_adapters/FixStartStateCollision
      default_planner_request_adapters/FixStartStatePathConstraints
    start_state_max_bounds_error: 0.1
    
    planner_configs:
      RRTConnectkConfigDefault:
        type: geometric::RRTConnect
        range: 0.0     # auto
    
      RRTkConfigDefault:
        type: geometric::RRT
        range: 0.0
        goal_bias: 0.05
    
      BiTRRTkConfigDefault:
        type: geometric::BiTRRT
        range: 0.0
        temp_change_factor: 0.1
        init_temperature: 100
        dist_temperature_ratio: 10
        cost_threshold: 1e300
    
      PRMkConfigDefault:
        type: geometric::PRM
        max_nearest_neighbors: 10
    
      LazyPRMStarkConfigDefault:
        type: geometric::LazyPRMStar
    
    scara_arm:
      default_planner_config: RRTConnectkConfigDefault
      planner_configs:
        - RRTConnectkConfigDefault
        - BiTRRTkConfigDefault
        - LazyPRMStarkConfigDefault
      projection_evaluator: joints(joint_1, joint_2)
      longest_valid_segment_fraction: 0.005
      simplify_solutions: true
