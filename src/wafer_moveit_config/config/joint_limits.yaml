# joint_limits.yaml
# ==================
# Per-joint velocity/acceleration limits for MoveIt2 trajectory generation.
# These MUST match (or be more conservative than) the URDF limits.
#
# Note: MoveIt's default time-parameterization respects these limits.
# wafer_trajectory's S-curve planner uses these SAME limits but with
# a jerk_limit parameter in addition — the key differentiator.
#
# Units: velocity [rad/s or m/s], acceleration [rad/s² or m/s²]

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 3.0          # rad/s
    has_acceleration_limits: true
    max_acceleration: 6.0      # rad/s²
    has_jerk_limits: true
    max_jerk: 30.0             # rad/s³  — used by wafer_trajectory, NOT MoveIt default

  joint_2:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 6.0
    has_jerk_limits: true
    max_jerk: 30.0

  joint_3:
    has_velocity_limits: true
    max_velocity: 6.0
    has_acceleration_limits: true
    max_acceleration: 12.0
    has_jerk_limits: true
    max_jerk: 60.0

  joint_z:
    has_velocity_limits: true
    max_velocity: 0.3          # m/s
    has_acceleration_limits: true
    max_acceleration: 0.6      # m/s²
    has_jerk_limits: true
    max_jerk: 3.0              # m/s³
