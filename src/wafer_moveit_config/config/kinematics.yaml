# kinematics.yaml
# =================
# IK solver configuration for MoveIt2 planning groups.
#
# For the SCARA arm, we use the KDL solver as a starting point.
# Since SCARA kinematics are simple (planar + Z), KDL works well.
#
# TODO (Phase 3): Consider using IKFast for faster IK if performance is needed.
# IKFast can be generated from the URDF using OpenRAVE, or use
# bio_ik for a gradient-descent alternative.

scara_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
